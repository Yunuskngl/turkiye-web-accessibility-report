name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Warnings are errors (Directory.Build.props), so this also fails on any analyzer warning.
      - name: Build
        run: dotnet build --configuration Release

      # The integration tests open local fixture pages in Chromium; they never reach the internet.
      - name: Install Chromium for the integration tests
        run: pwsh tests/A11yReport.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --configuration Release --no-build
